name: Build and Release Lua Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  build:
    runs-on: linux-arm64
    container:
      image: debian:bookworm
    strategy:
      matrix:
        include:
          - target: x86_64
            cc: gcc
            ar: ar
          - target: arm64
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar
    
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y build-essential gcc curl xxd git crossbuild-essential-arm64

      - name: Checkout
        run: git clone https://gitea.taile9a1d6.ts.net/${{ gitea.repository }}.git .

      - name: Download & Build Lua
        run: |
          curl -L https://www.lua.org/ftp/lua-5.4.7.tar.gz -o lua-5.4.7.tar.gz
          tar xzf lua-5.4.7.tar.gz
          cd lua-5.4.7/src && make PLAT=linux && cd ../..

      - name: Generate bytecode header
        run: |
          PROJECT_NAME=$(basename $(pwd) | sed 's/^lua-//')
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          ./lua-5.4.7/src/luac -o ${PROJECT_NAME}.luac ${PROJECT_NAME}.lua
          xxd -i ${PROJECT_NAME}.luac > ${PROJECT_NAME}_bytecode.h

      - name: Build Lua library for ${{ matrix.target }}
        run: |
          mkdir -p .build/lua .build/link/src
          cd lua-5.4.7/src
          for f in *.c *.h; do
            [ -f "$f" ] && cp "$f" ../../.build/lua/
          done
          cd ../../.build/lua
          
          for f in lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c; do
            [ -f "$f" ] && ${{ matrix.cc }} -Wno-deprecated-declarations -c "$f" -o "${f%.c}.o"
          done
          
          ${{ matrix.ar }} rcs liblua.a *.o
          cd ../..
          cp .build/lua/liblua.a .build/link/src/
          cp .build/lua/*.h .build/link/src/

      - name: Build binary
        run: |
          mkdir -p bin
          PROJECT_NAME=$(basename $(pwd) | sed 's/^lua-//')
          ${{ matrix.cc }} -o bin/${PROJECT_NAME}-linux-${{ matrix.target }} ${PROJECT_NAME}.c \
            -I .build/link/src \
            -L .build/link/src \
            -llua -lm

      - name: Upload to release
        if: ${{ !env.ACT }}  # Skip locally
        run: |
          PROJECT_NAME=$(basename $(pwd) | sed 's/^lua-//')
          BINARY="bin/${PROJECT_NAME}-linux-${{ matrix.target }}"
          
          curl -X POST https://gitea.taile9a1d6.ts.net/api/v1/repos/${{ gitea.repository }}/releases/tags/${{ github.event.inputs.version }}/assets \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -F "attachment=@${BINARY}"

  create-release:
    runs-on: linux-arm64
    if: ${{ !env.ACT }}  # Skip locally
    container:
      image: debian:bookworm
    
    steps:
      - name: Install curl
        run: apt-get update && apt-get install -y curl

      - name: Create Gitea Release
        run: |
          curl -X POST https://gitea.taile9a1d6.ts.net/api/v1/repos/${{ gitea.repository }}/releases \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "tag_name": "${{ github.event.inputs.version }}",
              "name": "Release ${{ github.event.inputs.version }}",
              "body": "Cross-compiled binaries",
              "draft": false,
              "prerelease": false
            }'
