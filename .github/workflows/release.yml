name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            mingw-w64 xxd curl

      - name: Download Lua 5.4.7
        run: |
          curl -L https://www.lua.org/ftp/lua-5.4.7.tar.gz -o lua-5.4.7.tar.gz
          tar xzf lua-5.4.7.tar.gz

      - name: Build Lua and luac
        run: |
          cd lua-5.4.7/src
          make PLAT=linux
          cd ../..

      - name: Generate bytecode
        run: |
          PROJECT_NAME=$(basename $GITHUB_REPOSITORY | sed 's/^lua-//')
          ./lua-5.4.7/src/luac -o ${PROJECT_NAME}.luac ${PROJECT_NAME}.lua
          xxd -i ${PROJECT_NAME}.luac > ${PROJECT_NAME}_bytecode.h

      - name: Build for x86_64
        run: |
          mkdir -p bin .build/lua .build/link/src
          cp lua-5.4.7/src/*.{c,h} .build/lua/
          cd .build/lua
          for f in lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c; do
            [ -f "$f" ] && gcc -Wno-deprecated-declarations -c "$f" -o "${f%.c}.o"
          done
          ar rcs liblua.a *.o
          cd ../..
          cp .build/lua/liblua.a .build/link/src/
          cp lua-5.4.7/src/*.h .build/link/src/
          gcc -o bin/blackjack-linux-x86_64 blackjack.c -I .build/link/src -L .build/link/src -llua -lm

      - name: Build for ARM64
        run: |
          mkdir -p bin .build/lua .build/link/src
          cp lua-5.4.7/src/*.{c,h} .build/lua/
          cd .build/lua
          for f in lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c; do
            [ -f "$f" ] && aarch64-linux-gnu-gcc -Wno-deprecated-declarations -c "$f" -o "${f%.c}.o"
          done
          aarch64-linux-gnu-ar rcs liblua.a *.o
          cd ../..
          cp .build/lua/liblua.a .build/link/src/
          cp lua-5.4.7/src/*.h .build/link/src/
          aarch64-linux-gnu-gcc -o bin/blackjack-linux-arm64 blackjack.c -I .build/link/src -L .build/link/src -llua -lm

      - name: Build for Windows
        run: |
          mkdir -p bin .build/lua .build/link/src
          cp lua-5.4.7/src/*.{c,h} .build/lua/
          cd .build/lua
          for f in lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c; do
            [ -f "$f" ] && x86_64-w64-mingw32-gcc -Wno-deprecated-declarations -c "$f" -o "${f%.c}.o"
          done
          x86_64-w64-mingw32-ar rcs liblua.a *.o
          cd ../..
          cp .build/lua/liblua.a .build/link/src/
          cp lua-5.4.7/src/*.h .build/link/src/
          x86_64-w64-mingw32-gcc -o bin/blackjack-windows.exe blackjack.c -I .build/link/src -L .build/link/src -llua

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: "Automated release build"
          draft: false
          prerelease: false

      - name: Upload x86_64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/blackjack-linux-x86_64
          asset_name: blackjack-linux-x86_64
          asset_content_type: application/octet-stream

      - name: Upload ARM64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/blackjack-linux-arm64
          asset_name: blackjack-linux-arm64
          asset_content_type: application/octet-stream

      - name: Upload Windows binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/blackjack-windows.exe
          asset_name: blackjack-windows.exe
          asset_content_type: application/octet-stream
